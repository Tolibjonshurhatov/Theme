<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>Theme</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08090b; --panel:#0e0f13; --line:rgba(255,255,255,0.08); --line-strong:rgba(255,255,255,0.18);
    --text:#f2f2f0; --text-dim:#8b8d93; --text-faint:#56585f; --white:#fff;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
    height:100vh; overflow:hidden; user-select:none;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{ font-family:'Space Grotesk',sans-serif; letter-spacing:-0.02em; }

  /* draggable title bar area for macOS traffic lights */
  .titlebar{ -webkit-app-region: drag; height:36px; }

  .app{ display:flex; height:calc(100vh - 36px); }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:220px; flex:0 0 220px; border-right:1px solid var(--line);
    padding:4px 14px 20px; display:flex; flex-direction:column; gap:4px;
    -webkit-app-region: drag;
  }
  .brand{ display:flex; align-items:center; gap:9px; padding:8px 8px 22px; -webkit-app-region: drag; }
  .brand .mark{ width:20px; height:20px; border-radius:5px; object-fit:cover; display:block; }
  .brand span{ font-weight:700; font-size:15px; }
  .cat-btn{
    -webkit-app-region: no-drag;
    display:flex; align-items:center; gap:10px;
    padding:10px 12px; border-radius:10px; font-size:13.5px; color:var(--text-dim);
    cursor:pointer; transition: all .12s ease;
  }
  .cat-btn:hover{ background:rgba(255,255,255,0.05); color:var(--text); }
  .cat-btn.active{ background:rgba(255,255,255,0.09); color:var(--text); }
  .cat-btn .dot{ width:6px; height:6px; border-radius:50%; background:var(--text-faint); }
  .cat-btn.active .dot{ background:#fff; box-shadow:0 0 6px #fff; }

  /* ---------- MAIN ---------- */
  .main{ flex:1; overflow-y:auto; padding:22px 26px 40px; }
  .main-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px; }
  .main-head h2{ font-size:20px; }
  .main-head span{ font-size:12.5px; color:var(--text-faint); }

  .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .card{
    position:relative; border-radius:14px; overflow:hidden; aspect-ratio:16/10;
    border:1px solid var(--line); cursor:pointer;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .card img{ width:100%; height:100%; object-fit:cover; display:block; }
  .card:hover{ transform:translateY(-3px); box-shadow:0 14px 30px rgba(0,0,0,.5); }
  .card .shade{ position:absolute; inset:0; background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.8) 100%); opacity:0; transition:opacity .15s ease; }
  .card:hover .shade{ opacity:1; }
  .card .meta{ position:absolute; left:12px; bottom:10px; right:12px; opacity:0; transform:translateY(6px); transition:all .15s ease; }
  .card:hover .meta{ opacity:1; transform:translateY(0); }
  .card .meta .name{ font-size:12.5px; font-weight:600; }
  .card .apply-btn{
    position:absolute; right:10px; top:10px; opacity:0;
    background:rgba(255,255,255,.9); color:#0a0a0a; border:none;
    font-size:11.5px; font-weight:600; padding:6px 10px; border-radius:8px;
    transition:opacity .15s ease; cursor:pointer;
  }
  .card:hover .apply-btn{ opacity:1; }

  /* ---------- MODAL ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(4px);
    display:none; align-items:center; justify-content:center; z-index:100;
  }
  .modal-overlay.show{ display:flex; }
  .modal{
    width:360px; background:var(--panel); border:1px solid var(--line-strong); border-radius:18px;
    padding:26px; text-align:center;
  }
  .modal .preview{ width:100%; aspect-ratio:16/9; border-radius:10px; overflow:hidden; margin-bottom:18px; border:1px solid var(--line); }
  .modal .preview img{ width:100%; height:100%; object-fit:cover; }
  .modal h3{ font-size:16px; margin-bottom:4px; }
  .modal p.sub{ font-size:12.5px; color:var(--text-dim); margin-bottom:20px; }
  .scope-options{ display:flex; gap:10px; margin-bottom:20px; }
  .scope-opt{
    flex:1; border:1px solid var(--line); border-radius:12px; padding:14px 8px;
    font-size:12.5px; cursor:pointer; transition:all .12s ease;
  }
  .scope-opt:hover{ border-color:var(--line-strong); }
  .scope-opt.selected{ border-color:#fff; background:rgba(255,255,255,.06); }
  .scope-opt .big{ font-size:20px; margin-bottom:6px; }
  .modal-actions{ display:flex; gap:10px; }
  .modal-actions button{
    flex:1; padding:11px; border-radius:10px; font-size:13.5px; font-weight:600; border:none; cursor:pointer;
  }
  .btn-cancel{ background:rgba(255,255,255,.06); color:var(--text); }
  .btn-apply{ background:#fff; color:#0a0a0a; }
  .btn-apply:hover{ background:#e6e6e6; }
  .btn-cancel:hover{ background:rgba(255,255,255,.1); }

  /* toast */
  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--panel); border:1px solid var(--line-strong); padding:12px 20px; border-radius:12px;
    font-size:13px; opacity:0; transition:all .25s ease; pointer-events:none; z-index:200;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="titlebar"></div>

<div class="app">
  <aside class="sidebar">
    <div class="brand"><img src="logo.png" class="mark" alt="Theme"><span>Theme</span></div>
    <div class="cat-btn active" data-cat="all"><span class="dot"></span>Hammasi</div>
    <div class="cat-btn" data-cat="cars"><span class="dot"></span>Mashinalar</div>
    <div class="cat-btn" data-cat="nature"><span class="dot"></span>Tabiat</div>
    <div class="cat-btn" data-cat="abstract"><span class="dot"></span>Abstrakt</div>
    <div class="cat-btn" data-cat="minimal"><span class="dot"></span>Minimal</div>
    <div class="cat-btn" data-cat="space"><span class="dot"></span>Kosmos</div>
    <div class="cat-btn" data-cat="arch"><span class="dot"></span>Arxitektura</div>
  </aside>

  <main class="main">
    <div class="main-head">
      <h2 id="sectionTitle">Hammasi</h2>
      <span id="sectionCount"></span>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="preview"><img id="modalImg" src=""></div>
    <h3 id="modalName">—</h3>
    <p class="sub">Qayerga o'rnatilsin?</p>
    <div class="scope-options">
      <div class="scope-opt selected" data-scope="all">
        <div class="big">🖥️</div>
        Barcha ekranlar
      </div>
      <div class="scope-opt" data-scope="main">
        <div class="big">🖥</div>
        Faqat bosh ekran
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="cancelBtn">Bekor qilish</button>
      <button class="btn-apply" id="applyBtn">O'rnatish</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="renderer.js"></script>
</body>
</html>
